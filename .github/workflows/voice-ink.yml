name: Voice ink
on:
  push:
    paths: ['final/voice-ink/**', '.github/workflows/voice-ink.yml']
  pull_request:
    paths: ['final/voice-ink/**', '.github/workflows/voice-ink.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final/voice-ink/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
