name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guidebook/package-lock.json
      - run: npm ci
        working-directory: guidebook
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          mkdir _site/guidebook
          cp guidebook/index.html guidebook/app.js guidebook/chart.js guidebook/style.css guidebook/personality_test.json _site/guidebook/
          cp -r guidebook/Courier_Prime _site/guidebook/
          mkdir -p _site/guidebook/node_modules
          cp -r guidebook/node_modules/gsap guidebook/node_modules/d3 guidebook/node_modules/compromise _site/guidebook/node_modules/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
